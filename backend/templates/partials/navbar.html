<header class="navbar navbar-expand-xl tf-navbar apgc-navbar">
  <div class="container-xl">
    <a class="navbar-brand" href="{% url 'home' %}" aria-label="APGC Document Management System home">{% include 'partials/brand.html' %}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#public-navigation" aria-controls="public-navigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="public-navigation" aria-label="Main navigation">
      <div class="navbar-nav ms-auto align-items-xl-center gap-xl-3">
        {% if request.user.is_authenticated %}
          <a class="nav-link" href="{% url 'documents:memo-list' %}">My workspace</a>
          {% if perms.organization.manage_employees %}<a class="nav-link" href="{% url 'organization:employee-list' %}">Organisation</a>{% endif %}
          <span class="nav-link" aria-label="Signed in as {{ request.user.get_username }}">{{ request.user.get_full_name|default:request.user.get_username }}</span>
          <form action="{% url 'admin:logout' %}" method="post" class="d-inline-flex">{% csrf_token %}<button class="btn btn-outline-primary" type="submit">Sign out</button></form>
        {% else %}
          <a class="nav-link" href="{% url 'home' %}#capabilities">Capabilities</a>
          <a class="btn btn-primary" href="{% url 'admin:login' %}">Sign in <span aria-hidden="true">↗</span></a>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
