<dialog class="action-confirmation" x-ref="confirmationDialog" aria-labelledby="{{ dialog_id }}{% if dialog_id_suffix %}-{{ dialog_id_suffix }}{% endif %}-title" aria-describedby="{{ dialog_id }}{% if dialog_id_suffix %}-{{ dialog_id_suffix }}{% endif %}-message">
  <div class="action-confirmation-content">
    <h2 id="{{ dialog_id }}{% if dialog_id_suffix %}-{{ dialog_id_suffix }}{% endif %}-title" class="h3"><span {% if dialog_dynamic_action %}x-text="confirmationTitle"{% elif dialog_dynamic_decision %}x-text="submitterValue === 'APPROVE' ? 'Approve this document?' : 'Return this document to the creator?'"{% endif %}>{{ dialog_title }}</span></h2>
    <p id="{{ dialog_id }}{% if dialog_id_suffix %}-{{ dialog_id_suffix }}{% endif %}-message"><span {% if dialog_dynamic_action %}x-text="confirmationMessage"{% elif dialog_dynamic_decision %}x-text="submitterValue === 'APPROVE' ? 'This will record your decision against the submitted version.' : 'The document will require further action before it can proceed.'"{% endif %}>{{ dialog_message }}</span></p>
    <div class="action-confirmation-buttons">
      <button class="btn btn-outline-primary" type="button" autofocus @click="$refs.confirmationDialog.close()">Cancel</button>
      <button class="btn btn-primary" type="button" {% if dialog_dynamic_action %}x-text="confirmationLabel"{% elif dialog_dynamic_decision %}x-text="submitterValue === 'APPROVE' ? 'Approve document' : 'Return for revision'"{% endif %} @click="if ($el.disabled || $refs.actionForm.dataset.confirmationSubmitting === 'true') return; const form = $refs.actionForm; const action = [...form.querySelectorAll('button[type=submit],input[type=submit]')].find(button => button.name === submitterName && button.value === submitterValue); confirmed = true; form.dataset.confirmationSubmitting = 'true'; form.dataset.confirmationDispatch = 'true'; form.setAttribute('aria-busy', 'true'); if (action) { form.requestSubmit(action); } else { form.requestSubmit(); } $refs.confirmationDialog.querySelectorAll('button').forEach(button => { button.disabled = true; });">{{ confirm_label }}</button>
    </div>
  </div>
</dialog>
