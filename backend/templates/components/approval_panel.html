<section class="card approval-panel" aria-labelledby="approval-title"><div class="card-header"><div><p class="eyebrow text-brand mb-1">YOUR ACTION</p><h2 id="approval-title" class="card-title">Review this memo</h2></div></div><div class="card-body"><p class="text-secondary">You are the assigned reviewer for {{ document.reference }}. Add a comment if useful; a reason is required when returning it.</p><form method="post" action="{% url 'documents:memo-review' document.pk %}">{% csrf_token %}<label class="form-label" for="review-comment">Review comment</label><textarea class="form-control" id="review-comment" name="comment" rows="3" maxlength="4000"></textarea><div class="review-actions"><button class="btn btn-outline-primary" type="submit" name="decision" value="RETURN">Return for revision</button><button class="btn btn-primary" type="submit" name="decision" value="APPROVE">Approve</button></div></form></div></section>
