{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to APGC Document Management System.">
  <meta name="htmx-config" content='{"selfRequestsOnly":true,"allowScriptTags":false}'>
  <title>{% block title %}APGC Digital Portal{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'apgc/brand/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'vendor/tabler/tabler.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'apgc/css/apgc-theme.css' %}">
  <link rel="stylesheet" href="{% static 'apgc/css/authentication.css' %}">
  <script src="{% static 'vendor/alpine/alpine.min.js' %}" defer></script>
</head>
<body class="apgc-auth">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" class="apgc-auth-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="apgc-auth-footer">&copy; {% now 'Y' %} Alliance Power Generation Company</footer>
</body>
</html>
