# Example only. dms.example.invalid is a placeholder, not a production hostname.
# Replace only after hostname, DNS and TLS are approved.
log_format dms_safe '$remote_addr [$time_local] $request_method $status '
                     '$body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name _;
    error_log /var/log/nginx/apgc-dms.error.log crit;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name dms.example.invalid;
    error_log /var/log/nginx/apgc-dms.error.log crit;
    access_log /var/log/nginx/apgc-dms.access.log dms_safe;
    return 301 https://dms.example.invalid$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dms.example.invalid;

    # Nginx error logs do not support a URI-redacting format. Keep their
    # severity high, restrict file access, and apply URI redaction before any
    # central forwarding. Validate behavior with the deployed Nginx version.
    error_log /var/log/nginx/apgc-dms.error.log crit;
    access_log /var/log/nginx/apgc-dms.access.log dms_safe;

    ssl_certificate /etc/letsencrypt/live/dms.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.example.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Five 20 MiB files per request (100 MiB payload) plus multipart overhead.
    client_max_body_size 110m;

    location /static/ {
        alias /opt/apgc-dms/app/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Do not add a /media/ alias. Private documents are delivered only by
    # permission-checked Django views.
    location / {
        proxy_pass http://unix:/run/apgc-dms/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
